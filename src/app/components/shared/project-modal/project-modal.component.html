<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-panel glass-card" role="dialog" aria-modal="true">

    <button class="modal-close" (click)="close.emit()" aria-label="Close modal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <div class="modal-scroll">

      <!-- Header -->
      <div class="modal-header">
        <span class="modal-category">{{ project.category }}</span>
        <h2 class="modal-title">{{ project.title }}</h2>
        <p class="modal-desc">{{ project.shortDescription }}</p>
        <div class="modal-tags">
          <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
        </div>
      </div>

      <!-- Metrics -->
      <div class="modal-metrics" *ngIf="project.metrics && project.metrics.length">
        <div class="metric-card" *ngFor="let m of project.metrics">
          <span class="metric-value">{{ m.value }}<span class="metric-unit" *ngIf="m.unit">{{ m.unit }}</span></span>
          <span class="metric-label">{{ m.label }}</span>
        </div>
      </div>

      <!-- Image gallery -->
      <div class="modal-gallery">
        <ng-container *ngFor="let img of project.images">
          <div class="gallery-placeholder" *ngIf="img.includes('project-placeholder'); else galleryImagePlaceholder">
            <div class="placeholder-inner">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>Screenshot Preview</span>
            </div>
          </div>
          <ng-template #galleryImagePlaceholder>
            <div class="gallery-placeholder">
              <img class="gallery-img" [src]="img" [alt]="project.title" />
            </div>
          </ng-template>
        </ng-container>
      </div>

      <div class="modal-body">
        <!-- Overview -->
        <div class="modal-section" *ngIf="project.overview?.length">
          <h3 class="modal-section-title">
            <span class="section-icon">📝</span> Overview
          </h3>
          <p class="modal-desc" *ngFor="let p of project.overview">{{ p }}</p>
        </div>

        <!-- Technologies -->
        <div class="modal-section">
          <h3 class="modal-section-title">
            <span class="section-icon">⚙️</span> Technologies Used
          </h3>
          <div class="tech-pills">
            <span class="tech-pill" *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
        </div>

        <!-- Features -->
        <div class="modal-section">
          <h3 class="modal-section-title">
            <span class="section-icon">✨</span> Key Features
          </h3>
          <ul class="modal-list">
            <li *ngFor="let f of project.features">
              <span class="list-dot"></span>{{ f }}
            </li>
          </ul>
        </div>

        <!-- Results -->
        <div class="modal-section" *ngIf="project.results?.length">
          <h3 class="modal-section-title">
            <span class="section-icon">📊</span> Results & Impact
          </h3>
          <ul class="modal-list results">
            <li *ngFor="let r of project.results">
              <span class="list-check">✓</span>{{ r }}
            </li>
          </ul>
        </div>
      </div>

      <!-- Actions -->
      <div class="modal-footer">
        <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          View on GitHub
        </a>
        <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" class="btn-outline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Live Demo
        </a>
      </div>

    </div>
  </div>
</div>
